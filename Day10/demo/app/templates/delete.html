{% extends 'base.html' %}
{% block title %}이야기 삭제 · note{% endblock %}
{% block content %}
<section class="confirmation form-card"><p class="eyebrow">BEFORE YOU GO</p><h1>이 페이지를<br>지울까요?</h1><p class="lead">이야기와 함께 달린 댓글이 삭제됩니다.<br>삭제한 내용은 되돌릴 수 없어요.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="page" value="{{ page }}"><input type="hidden" name="confirm" value="yes"><div class="form-actions"><a class="button outline" href="{{ url_for('posts.detail', post_id=post_id, page=page) }}">계속 보관하기</a><button class="button secondary" type="submit">이야기 삭제</button></div></form></section>
{% endblock %}
